name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0
      - run: npm install --package-lock=false
      - run: npm run pack
      - run: npm run test:package
      - name: Publish verified package with provenance
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/corax/package.json').version")
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm run release -- --provenance --tag "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: corax-npm-package
          path: artifacts/corax.tgz
          if-no-files-found: error
